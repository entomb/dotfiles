# tmux defaults, shared across machines.
#
# Colours are Catppuccin Macchiato. The literal values are used rather than
# terminal-overrides 256-colour indices so they survive a terminal whose palette
# differs, which matters for the WSL host and a Wayland terminal that are not
# the same terminal at all.

set -g mouse on
set -g history-limit 100000

# Do not wait half a second to decide whether a key is an escape sequence. The
# default 500ms delay is very visible when sending Escape or a vim key.
set -g escape-time 0

# Report focus changes, so programs that change their prompt on focus (and shell
# integrations generally) work inside tmux.
set -g focus-events on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

# --- Status line ------------------------------------------------------------
set -g status-interval 5
set -g status-style "bg=#1e2030,fg=#cad3f5"
set -g status-left " #[fg=#8aadf4,bold]#S #[fg=#494d64]│ "
set -g status-right "#[fg=#8087a2]%Y-%m-%d  %H:%M "
set -g window-status-format " #[fg=#8087a2]#I:#W "
set -g window-status-current-format "#[fg=#1e2030,bg=#8aadf4,bold] #I:#W "

# --- Splits -----------------------------------------------------------------
# | and _ as split shorthands. Plain split-window leaves the new pane below,
# which is rarely what is wanted.
bind | split-window -h
bind _ split-window -v

# v enters copy mode directly. Copied text lands in the tmux buffer; to put it
# on the system clipboard as well, bind a send-keys to the outer terminal's
# clipboard tool, which is machine-specific and so not set here.
bind v copy-mode
